version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: traffic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: traffic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: traffic-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/traffic
      - REDIS_URL=redis://redis:6379/0
      - PORT=5001
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./traffic-pulse-main
      args:
        - VITE_API_URL=http://localhost:5001
    container_name: traffic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

networks:
  default:
    name: traffic-net

volumes:
  pgdata:
